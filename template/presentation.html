<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title><!-- PAPER_NAME --> · Paper Weekly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c1917;
      --muted: #57534e;
      --line: #d6d3d1;
      --paper: #faf8f5;
      --card: #ffffff;
      --accent: #0f4c4a;
      --accent-soft: #e7f1f0;
      --warn: #9a3412;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--paper); color: var(--ink); }
    body {
      font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif;
      overflow: hidden;
    }
    .deck { height: 100%; }
    .slide {
      display: none;
      height: 100%;
      padding: 56px 72px 72px;
      flex-direction: column;
    }
    .slide.active { display: flex; }
    .kicker {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 12px;
    }
    h1 {
      font-family: "Noto Serif SC", serif;
      font-size: 40px;
      line-height: 1.25;
      font-weight: 700;
      max-width: 18em;
    }
    h2 {
      font-family: "Noto Serif SC", serif;
      font-size: 32px;
      line-height: 1.3;
      margin-bottom: 28px;
    }
    p, li { font-size: 20px; line-height: 1.65; color: var(--ink); }
    .sub { margin-top: 18px; font-size: 18px; color: var(--muted); max-width: 42em; }
    .meta { margin-top: 28px; font-size: 16px; color: var(--muted); }
    .meta a { color: var(--accent); }
    ul { padding-left: 1.15em; }
    li + li { margin-top: 10px; }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 20px 22px;
    }
    .card h3 {
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .card p, .card li { font-size: 17px; }
    .flow {
      display: flex;
      align-items: stretch;
      gap: 10px;
      margin-top: 8px;
    }
    .flow .box {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--line);
      padding: 16px 18px;
    }
    .flow .arrow {
      display: flex;
      align-items: center;
      color: var(--accent);
      font-size: 22px;
    }
    .eq {
      margin: 12px 0;
      padding: 14px 18px;
      background: var(--accent-soft);
      font-family: ui-monospace, "IBM Plex Mono", monospace;
      font-size: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    th { color: var(--muted); font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
    .footer {
      position: fixed;
      left: 72px;
      right: 72px;
      bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }
    .progress {
      position: fixed;
      left: 0; right: 0; top: 0;
      height: 3px;
      background: var(--line);
    }
    .progress > span {
      display: block;
      height: 100%;
      background: var(--accent);
      width: 0%;
    }
    .note { color: var(--warn); font-size: 16px; margin-top: 16px; }
    @media (max-width: 900px) {
      .slide { padding: 32px 24px 64px; }
      h1 { font-size: 28px; }
      h2 { font-size: 24px; }
      p, li { font-size: 16px; }
      .grid, .flow { grid-template-columns: 1fr; flex-direction: column; }
      .footer { left: 24px; right: 24px; }
    }
  </style>
</head>
<body>
  <div class="progress"><span id="bar"></span></div>
  <div class="deck" id="deck">

    <section class="slide active">
      <div class="kicker">Paper Weekly · YYYY-MM-DD</div>
      <h1><!-- PAPER_TITLE --></h1>
      <p class="sub"><!-- ONE_LINER --></p>
      <p class="meta">
        <!-- VENUE --> · <!-- AUTHORS --><br />
        <a href="<!-- PROJECT_URL -->">Project</a> ·
        <a href="<!-- PAPER_URL -->">Paper</a> ·
        <a href="<!-- CODE_URL -->">Code</a>
      </p>
    </section>

    <section class="slide">
      <div class="kicker">问题</div>
      <h2>这篇论文要解决什么？</h2>
      <ul>
        <li><!-- PROBLEM_1 --></li>
        <li><!-- PROBLEM_2 --></li>
        <li><!-- PROBLEM_3 --></li>
      </ul>
    </section>

    <section class="slide">
      <div class="kicker">挑战</div>
      <h2>现有方法卡在哪里？</h2>
      <div class="grid">
        <div class="card">
          <h3>挑战 1</h3>
          <p><!-- CHALLENGE_1 --></p>
        </div>
        <div class="card">
          <h3>挑战 2</h3>
          <p><!-- CHALLENGE_2 --></p>
        </div>
        <div class="card">
          <h3>挑战 3</h3>
          <p><!-- CHALLENGE_3 --></p>
        </div>
        <div class="card">
          <h3>本文切入点</h3>
          <p><!-- CHALLENGE_HOOK --></p>
        </div>
      </div>
    </section>

    <section class="slide">
      <div class="kicker">核心 Idea</div>
      <h2><!-- IDEA_TITLE --></h2>
      <p><!-- IDEA_BODY --></p>
    </section>

    <section class="slide">
      <div class="kicker">贡献</div>
      <h2>论文声称的贡献</h2>
      <ul>
        <li><!-- CONTRIB_1 --></li>
        <li><!-- CONTRIB_2 --></li>
        <li><!-- CONTRIB_3 --></li>
      </ul>
    </section>

    <section class="slide">
      <div class="kicker">方法</div>
      <h2>方法总览</h2>
      <div class="flow">
        <div class="box"><strong>1</strong><br /><!-- PIPE_1 --></div>
        <div class="arrow">→</div>
        <div class="box"><strong>2</strong><br /><!-- PIPE_2 --></div>
        <div class="arrow">→</div>
        <div class="box"><strong>3</strong><br /><!-- PIPE_3 --></div>
      </div>
    </section>

    <section class="slide">
      <div class="kicker">方法</div>
      <h2><!-- METHOD_DETAIL_TITLE --></h2>
      <ul>
        <li><!-- METHOD_1 --></li>
        <li><!-- METHOD_2 --></li>
        <li><!-- METHOD_3 --></li>
      </ul>
    </section>

    <section class="slide">
      <div class="kicker">实验</div>
      <h2>关键结果</h2>
      <ul>
        <li><!-- RESULT_1 --></li>
        <li><!-- RESULT_2 --></li>
        <li><!-- RESULT_3 --></li>
      </ul>
    </section>

    <section class="slide">
      <div class="kicker">讨论</div>
      <h2>局限与阅读收获</h2>
      <div class="grid">
        <div class="card">
          <h3>局限</h3>
          <p><!-- LIMITATION --></p>
        </div>
        <div class="card">
          <h3>可带走的点</h3>
          <p><!-- TAKEAWAY --></p>
        </div>
      </div>
    </section>

  </div>
  <div class="footer">
    <span><!-- PAPER_NAME --> · Paper Weekly</span>
    <span id="counter">1 / 1</span>
  </div>
  <script>
    const slides = [...document.querySelectorAll(".slide")];
    const bar = document.getElementById("bar");
    const counter = document.getElementById("counter");
    let i = 0;
    function show(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach((s, k) => s.classList.toggle("active", k === i));
      bar.style.width = ((i + 1) / slides.length * 100) + "%";
      counter.textContent = (i + 1) + " / " + slides.length;
    }
    document.addEventListener("keydown", (e) => {
      if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); show(i + 1); }
      if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(i - 1); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(slides.length - 1);
    });
    document.body.addEventListener("click", (e) => {
      if (e.target.closest("a")) return;
      show(e.clientX > innerWidth * 0.28 ? i + 1 : i - 1);
    });
    show(0);
  </script>
</body>
</html>
