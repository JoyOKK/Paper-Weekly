baseURL = "https://joyokk.github.io/Paper-Weekly/"
defaultContentLanguage = "zh"
title = "Paper Weekly"
theme = "PaperMod"
enableRobotsTXT = true
hasCJKLanguage = true
enableEmoji = true
buildFuture = true


[pagination]
  pagerSize = 12

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  lineNos = false
  guessSyntax = true

[params]
  env = "production"
  author = "winteran"
  description = "每周 1–2 篇人体动作 / 生成相关论文的阅读笔记，方便随时更新与翻阅。"
  keywords = ["paper weekly", "human motion", "motion generation"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = true
  comments = false
  hideFooter = false
  mainSections = ["posts"]
  DateFormat = "2006-01-02"
  disableSpecialFirstPost = true

[params.homeInfoParams]
  Title = "Paper Weekly"
  Content = "个人论文阅读博客。每周 1–2 篇，记录核心 Idea、挑战、方法与实验，按标签和归档随时查阅。"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/JoyOKK/Paper-Weekly"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 3
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 4
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 5

[languages.zh]
  label = "简体中文"
  locale = "zh-CN"
  weight = 1
